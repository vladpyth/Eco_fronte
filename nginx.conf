upstream rhzo_backend {
    server host.docker.internal:8080;
    keepalive 32;
}

upstream poo_backend {
    server host.docker.internal:8081;
    keepalive 32;
}

upstream ponod_backend {
    server host.docker.internal:8082;
    keepalive 32;
}

upstream ponoinput_backend {
    server host.docker.internal:8083;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API РХЗО (Spring Boot на хосте, порт 8080)
    location /api/ {
        proxy_pass http://rhzo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API РОО (Spring Boot на хосте, порт 8081) — /api-poo/* → /api/* на бэкенде
    location /api-poo/ {
        rewrite ^/api-poo/(.*)$ /api/$1 break;
        proxy_pass http://poo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API РОИО (Spring Boot на хосте, порт 8082) — /api-ponod/* → /api/* на бэкенде
    location /api-ponod/ {
        rewrite ^/api-ponod/(.*)$ /api/$1 break;
        proxy_pass http://ponod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API РОИО (для внесения, порт 8083) — /api-ponoinput/* → /api/* на бэкенде
    location /api-ponoinput/ {
        rewrite ^/api-ponoinput/(.*)$ /api/$1 break;
        proxy_pass http://ponoinput_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Устаревший вариант (только /api без слэша) — оставлен для совместимости
    location = /api {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вариант B (если фронт и бэк в одной docker-сети): закомментируйте блок выше и раскомментируйте,
    # подставьте имя сервиса из docker-compose бэкенда (например app:8080):
    # location /api {
    #     proxy_pass http://app:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
